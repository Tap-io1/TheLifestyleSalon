<!DOCTYPE html>
<html lang="el">

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #FEE88A;
    color: #000000;

    display: flex;
    justify-content: center;

    padding: 28px 18px 35px;

    position: relative;
    overflow-x: hidden;
}


/* =========================
   SUBTLE BACKGROUND
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(0,0,0,0.05) 0px,
            rgba(0,0,0,0.05) 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(0,0,0,0.035) 0px,
            rgba(0,0,0,0.035) 1px,
            transparent 2px
        );

    background-size:
        300px 300px,
        380px 380px;

    z-index: 0;
}


/* =========================
   SOFT BACKGROUND GLOW
========================= */

body::after {
    content: "";

    position: fixed;

    width: 380px;
    height: 380px;

    top: -190px;
    right: -170px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.18),
            transparent 70%
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    text-align: center;

    position: relative;
    z-index: 1;
}


/* =========================
   LOGO AREA
========================= */

.logo-wrapper {
    width: 100%;
    height: 320px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 10px;
}

.logo {
    width: 100%;
    max-width: 400px;
    max-height: 310px;

    object-fit: contain;

    display: block;
}


/* =========================
   DIVIDER
========================= */

.divider {
    width: 60px;
    height: 2px;

    margin: 0 auto 28px;

    background: #000000;

    border-radius: 20px;

    opacity: 0.8;
}


/* =========================
   BUTTON CONTAINER
========================= */

.buttons {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}


/* =========================
   BUTTONS
========================= */

.btn {
    width: 100%;

    min-height: 64px;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    padding: 15px 20px;

    color: #000000;

    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.2px;

    background: rgba(255,255,255,0.08);

    border: 2px solid #000000;

    border-radius: 14px;

    box-shadow:
        0 6px 16px rgba(0,0,0,0.08);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}


/* =========================
   BUTTON HOVER
========================= */

.btn:hover {
    background: rgba(255,255,255,0.20);

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(0,0,0,0.12);
}


/* =========================
   BUTTON ACTIVE
========================= */

.btn:active {
    transform: scale(0.98);
}


/* =========================
   ICON
========================= */

.icon {
    width: 42px;
    min-width: 42px;

    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 15px;

    color: #000000;
}

.icon svg {
    width: 28px;
    height: 28px;

    stroke: currentColor;
    fill: none;

    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================
   BUTTON TEXT
========================= */

.btn-text {
    flex: 1;

    text-align: left;

    color: #000000;
}


/* =========================
   FOOTER
========================= */

.footer-line {
    display: flex;
    align-items: center;
    justify-content: center;

    margin-top: 33px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #000000;

    opacity: 0.5;
}

.footer-symbol {
    margin: 0 12px;

    color: #000000;

    font-size: 13px;
}

.footer {
    margin-top: 14px;

    font-size: 11px;

    color: #000000;

    opacity: 0.7;

    letter-spacing: 1.3px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding:
            20px
            16px
            30px;
    }

    .logo-wrapper {
        height: 290px;
    }

    .logo {
        max-width: 370px;
        max-height: 280px;
    }

    .btn {
        min-height: 62px;

        padding:
            14px
            17px;

        font-size: 14px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .logo-wrapper {
        height: 255px;
    }

    .logo {
        max-width: 330px;
        max-height: 245px;
    }

    .btn {
        min-height: 58px;

        padding:
            13px
            14px;

        font-size: 13.5px;
    }

    .icon {
        width: 36px;
        min-width: 36px;

        height: 36px;

        margin-right: 11px;
    }

    .icon svg {
        width: 25px;
        height: 25px;
    }

}

</style>
</head>
